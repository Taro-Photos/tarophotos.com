name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apps
          - infra

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: filter
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Handle Workflow Dispatch (Manual Execution)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            echo "Manual trigger detected. Target: $TARGET"
            
            if [ "$TARGET" == "all" ]; then
              echo "apps=true" >> $GITHUB_OUTPUT
              echo "infra=true" >> $GITHUB_OUTPUT
            elif [ "$TARGET" == "apps" ]; then
              echo "apps=true" >> $GITHUB_OUTPUT
              echo "infra=false" >> $GITHUB_OUTPUT
            elif [ "$TARGET" == "infra" ]; then
              echo "apps=false" >> $GITHUB_OUTPUT
              echo "infra=true" >> $GITHUB_OUTPUT
            fi
            exit 0 # Skip git diff logic
          fi

          # Handle Push/PR (Auto Detection)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="origin/${{ github.base_ref }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Check if base commit exists (for force push cases etc.)
          if ! git cat-file -e $BASE_SHA; then
            echo "Base SHA $BASE_SHA not found, checking against previous commit"
            BASE_SHA="HEAD^"
          fi

          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^apps/|^packages/|^package.json|^pnpm-lock.yaml'; then
            echo "apps=true" >> $GITHUB_OUTPUT
          else
            echo "apps=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -qE '^infra/'; then
            echo "infra=true" >> $GITHUB_OUTPUT
          else
            echo "infra=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Environment Variables
        env:
          # Basic Config
          REPO_NAME: ${{ secrets.REPO_NAME }}
          AMPLIFY_APP_NAME: ${{ secrets.AMPLIFY_APP_NAME }}
          # Deploy Config (Required for main branch)
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          APPS_CHANGED="${{ steps.filter.outputs.apps }}"
          INFRA_CHANGED="${{ steps.filter.outputs.infra }}"
          IS_MAIN="${{ github.ref == 'refs/heads/main' }}"
          # Check if this is a PR from a fork
          IS_FORK="false"
          if [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            IS_FORK="true"
          fi
          
          if [ "$APPS_CHANGED" == "true" ] || [ "$INFRA_CHANGED" == "true" ]; then
            MISSING_VARS=""
            MISSING_OPTIONAL_VARS=""
            
            # Check Required Variables
            # For Fork PRs, we skip strict check to allow CI to pass with dummy values later
            if [ "$IS_FORK" == "false" ]; then
              if [ -z "$REPO_NAME" ]; then MISSING_VARS="${MISSING_VARS:+$MISSING_VARS, }REPO_NAME"; fi
              if [ -z "$AMPLIFY_APP_NAME" ]; then MISSING_VARS="${MISSING_VARS:+$MISSING_VARS, }AMPLIFY_APP_NAME"; fi
            else
              echo "::warning::Running from Fork. Skipping strict environment variable checks."
            fi
            
            # Required for deployment (main branch only)
            if [ "$IS_MAIN" == "true" ]; then
              if [ -z "$AWS_ACCESS_KEY_ID" ]; then MISSING_VARS="${MISSING_VARS:+$MISSING_VARS, }AWS_ACCESS_KEY_ID"; fi
              if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then MISSING_VARS="${MISSING_VARS:+$MISSING_VARS, }AWS_SECRET_ACCESS_KEY"; fi
              if [ -z "$GH_PAT" ]; then MISSING_VARS="${MISSING_VARS:+$MISSING_VARS, }GH_PAT"; fi
              
              # Optional Variables (Warning only)
              if [ -z "$DOMAIN_NAME" ]; then MISSING_OPTIONAL_VARS="${MISSING_OPTIONAL_VARS:+$MISSING_OPTIONAL_VARS, }DOMAIN_NAME"; fi
            fi
            
            if [ ! -z "$MISSING_OPTIONAL_VARS" ]; then
              echo "::warning::Missing optional environment variables: $MISSING_OPTIONAL_VARS"
              echo "Some features (e.g. custom domain) may not work without these variables."
            fi

            if [ ! -z "$MISSING_VARS" ]; then
              echo "::error::Missing required environment variables: $MISSING_VARS"
              echo "Please set these variables in GitHub Secrets."
              exit 1
            fi
          fi

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.apps == 'true' || needs.changes.outputs.infra == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.apps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.apps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Archive build artifacts
        run: tar -czf build-output.tar.gz -C apps/web .next

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.gz
          retention-days: 7

  e2e:
    name: E2E (responsive)
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.apps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium + webkit)
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium webkit

      - name: Run responsive e2e (builds + serves internally)
        run: pnpm --filter @repo/web exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  cdk-check:
    name: CDK Check
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.infra == 'true' }}
    env:
      REPO_NAME: ${{ secrets.REPO_NAME || 'check-repo' }}
      # 合成を通すためだけのダミー値。SES_FROM_EMAIL / SES_DOMAIN のどちらも無いと
      # stack が 1 つも合成されず `cdk synth` は exit 1 で落ちる（実測）。
      # secret を使わないのは、この値が deploy に流れる経路をそもそも作らないため。
      SES_FROM_EMAIL: 'synth-only@example.com'
      CDK_DEFAULT_ACCOUNT: '123456789012'
      CDK_DEFAULT_REGION: 'ap-northeast-1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CDK Synth
        working-directory: infra
        run: npx cdk synth

# デプロイジョブは置かない。
#   - Amplify（旧 deploy-app）は 2026-09-01 に撤収済み
#   - このリポの CDK が宣言する SesStack は **stack 名が i-willink.com のものと衝突する**。
#     同一アカウント・同一リージョンの CloudFormation stack `SesStack` は i-willink.com が
#     所有し `EmailIdentity = noreply@i-willink.com` を持つ（実測 2026-09-01）。ここから
#     `cdk deploy` を打つと、その本番 SES ID を noreply@tarophotos.com で上書きしてしまう。
# infra/ の適用が要るときは、対象 stack を名指しして手元から実行する。
