name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to check (lint/test/build/cdk synth; no deploy)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apps
          - infra

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: filter
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Handle Workflow Dispatch (Manual Execution)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            echo "Manual trigger detected. Target: $TARGET"
            
            if [ "$TARGET" == "all" ]; then
              echo "apps=true" >> $GITHUB_OUTPUT
              echo "infra=true" >> $GITHUB_OUTPUT
            elif [ "$TARGET" == "apps" ]; then
              echo "apps=true" >> $GITHUB_OUTPUT
              echo "infra=false" >> $GITHUB_OUTPUT
            elif [ "$TARGET" == "infra" ]; then
              echo "apps=false" >> $GITHUB_OUTPUT
              echo "infra=true" >> $GITHUB_OUTPUT
            fi
            exit 0 # Skip git diff logic
          fi

          # Handle Push/PR (Auto Detection)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="origin/${{ github.base_ref }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          
          # Check if base commit exists (for force push cases etc.)
          if ! git cat-file -e $BASE_SHA; then
            echo "Base SHA $BASE_SHA not found, checking against previous commit"
            BASE_SHA="HEAD^"
          fi

          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^apps/|^packages/|^package.json|^pnpm-lock.yaml'; then
            echo "apps=true" >> $GITHUB_OUTPUT
          else
            echo "apps=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED_FILES" | grep -qE '^infra/'; then
            echo "infra=true" >> $GITHUB_OUTPUT
          else
            echo "infra=false" >> $GITHUB_OUTPUT
          fi


  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.apps == 'true' || needs.changes.outputs.infra == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.apps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.apps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Archive build artifacts
        run: tar -czf build-output.tar.gz -C apps/web .next

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.tar.gz
          retention-days: 7

  e2e:
    name: E2E (responsive)
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.apps == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium + webkit)
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium webkit

      - name: Run responsive e2e (builds + serves internally)
        run: pnpm --filter @repo/web exec playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  cdk-check:
    name: CDK Check
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ needs.changes.outputs.infra == 'true' }}
    env:
      # 合成を通すためだけのダミー値。SES_FROM_EMAIL / SES_DOMAIN のどちらも無いと
      # stack が 1 つも合成されず `cdk synth` は exit 1 で落ちる（実測）。
      # secret を使わないのは、この値が deploy に流れる経路をそもそも作らないため。
      SES_FROM_EMAIL: 'synth-only@example.com'
      CDK_DEFAULT_ACCOUNT: '123456789012'
      CDK_DEFAULT_REGION: 'ap-northeast-1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CDK Synth
        working-directory: infra
        run: npx cdk synth

# デプロイジョブは置かない（AWS の静的キー・GH_PAT 等の secrets も不要。2026-09-23 に撤去）。
#   - Amplify（旧 deploy-app）は 2026-09-01 に撤収済み
#   - このリポの CDK が宣言する SesStack は **stack 名が i-willink.com のものと衝突する**。
#     同一アカウント・同一リージョンの CloudFormation stack `SesStack` は i-willink.com が
#     所有し `EmailIdentity = noreply@i-willink.com` を持つ（実測 2026-09-01）。ここから
#     `cdk deploy` を打つと、その本番 SES ID を noreply@tarophotos.com で上書きしてしまう。
# stack 名を名指ししても衝突は避けられない。infra/ を適用するのは、衝突を解消してから。
